<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dot SVG Maker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Dot SVG Maker</h1>
    <p class="subtitle">ウェブベースのドット絵エディター</p>
  </header>

  <main>
    <!-- Toolbar -->
    <section class="toolbar" aria-label="ツールバー">
      <!-- Canvas size -->
      <div class="toolbar-group">
        <label for="canvas-width">幅</label>
        <input type="number" id="canvas-width" value="16" min="1" max="128" />
        <span>×</span>
        <label for="canvas-height">高さ</label>
        <input type="number" id="canvas-height" value="16" min="1" max="128" />
        <button id="btn-resize" class="btn btn-secondary">サイズ変更</button>
      </div>

      <!-- Tools -->
      <div class="toolbar-group" role="group" aria-label="描画ツール">
        <button id="tool-pencil" class="btn tool-btn active" data-tool="pencil" title="鉛筆 (P)">✏️ 鉛筆</button>
        <button id="tool-eraser" class="btn tool-btn" data-tool="eraser" title="消しゴム (E)">🧹 消しゴム</button>
        <button id="tool-fill" class="btn tool-btn" data-tool="fill" title="塗りつぶし (F)">🪣 塗りつぶし</button>
        <button id="tool-eyedropper" class="btn tool-btn" data-tool="eyedropper" title="スポイト (I)">💉 スポイト</button>
      </div>

      <!-- Color picker -->
      <div class="toolbar-group">
        <label for="color-picker">色</label>
        <input type="color" id="color-picker" value="#000000" />
        <div id="color-preview" class="color-preview" style="background:#000000;"></div>
      </div>

      <!-- Edit actions -->
      <div class="toolbar-group">
        <button id="btn-undo" class="btn btn-secondary" title="元に戻す (Ctrl+Z)">↩️ 元に戻す</button>
        <button id="btn-redo" class="btn btn-secondary" title="やり直し (Ctrl+Y)">↪️ やり直し</button>
        <button id="btn-clear" class="btn btn-secondary" title="クリア">🗑️ クリア</button>
      </div>

      <!-- Zoom -->
      <div class="toolbar-group">
        <label for="zoom-range">ズーム</label>
        <input type="range" id="zoom-range" min="4" max="64" value="20" step="2" />
        <span id="zoom-label">20px</span>
      </div>
    </section>

    <!-- Editor area -->
    <div class="editor-layout">
      <!-- Canvas container -->
      <div class="canvas-wrapper" id="canvas-wrapper">
        <canvas id="dot-canvas"></canvas>
      </div>

      <!-- Side panel: palette + export -->
      <aside class="side-panel">
        <!-- Color palette -->
        <section class="panel-section">
          <h2>パレット</h2>
          <div id="palette" class="palette"></div>
          <div class="palette-actions">
            <button id="btn-add-color" class="btn btn-small btn-secondary">＋ 追加</button>
            <button id="btn-clear-palette" class="btn btn-small btn-secondary">リセット</button>
          </div>
        </section>

        <!-- Background color -->
        <section class="panel-section">
          <h2>背景色</h2>
          <div class="toolbar-group">
            <input type="color" id="bg-color-picker" value="#ffffff" />
            <label>
              <input type="checkbox" id="transparent-bg" />
              透明
            </label>
          </div>
        </section>

        <!-- Grid toggle -->
        <section class="panel-section">
          <h2>グリッド</h2>
          <label>
            <input type="checkbox" id="show-grid" checked />
            グリッド表示
          </label>
        </section>

        <!-- Export -->
        <section class="panel-section">
          <h2>エクスポート</h2>
          <div class="export-group">
            <button id="btn-export-svg" class="btn btn-primary">SVG ダウンロード</button>
            <button id="btn-export-png" class="btn btn-primary">PNG ダウンロード</button>
            <button id="btn-export-webp" class="btn btn-primary">WebP ダウンロード</button>
          </div>
          <div class="export-group">
            <label for="export-scale">PNG/WebP スケール</label>
            <input type="number" id="export-scale" value="8" min="1" max="32" />
            <span>×</span>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <footer>
    <p><a href="https://github.com/oqzl/Dot-SVG-Maker" target="_blank" rel="noopener">GitHub</a></p>
  </footer>

  <script src="editor.js"></script>
</body>
</html>
